# RemoteMCPServer for kubectl-mcp-server (stateless Streamable HTTP)
# Use this with kagent to connect to kubectl-mcp-server running as a service
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: kubectl-mcp-server
  namespace: default
spec:
  description: "kubectl-mcp-server provides 280+ Kubernetes management tools for AI assistants"
  protocol: STREAMABLE_HTTP
  url: http://kubectl-mcp-server.kubectl-mcp.svc.cluster.local:8000/mcp
