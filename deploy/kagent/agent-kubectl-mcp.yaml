apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: kubectl-mcp-agent
  namespace: default
spec:
  type: Declarative
  description: "Kubernetes AI agent using the kubectl-mcp-server core and helm toolsets"
  declarative:
    modelConfig: default-model-config
    systemMessage: |
      You are an advanced Kubernetes AI assistant powered by kubectl-mcp-server.
      Use kubectl_get for any resource kind, kubectl_describe and kubectl_logs to dig in,
      diagnose_pod_crash and detect_pending_pods for failing workloads, and the helm_* tools
      for releases. To expose more tools, start the server with MCP_TOOLSETS (for example
      default,ops,diagnostics) and add their names below.
      
      Always start with read-only operations before making changes.
      Explain your actions clearly and verify results after modifications.
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: kubectl-mcp-server
          toolNames:
            - kubectl_get
            - kubectl_describe
            - kubectl_logs
            - kubectl_top
            - kubectl_explain
            - get_api_resources
            - kubectl_generic
            - kubectl_apply
            - kubectl_patch
            - delete_resource
            - kubectl_scale
            - kubectl_rollout
            - exec_in_pod
            - list_contexts
            - health_check
            - diagnose_pod_crash
            - detect_pending_pods
            - detect_ecosystem
            - helm_list
            - helm_status
            - helm_get
            - helm_history
            - install_helm_chart
            - upgrade_helm_chart
            - uninstall_helm_chart
            - helm_rollback
    a2aConfig:
      skills:
        - id: full-k8s-management
          name: Full Kubernetes Management
          description: Kubernetes cluster management with kubectl and Helm
          tags: [kubernetes, k8s, cluster, management]
          examples:
            - "List all pods across namespaces"
            - "Install nginx using Helm"
            - "Diagnose why my pod is crashing"
            - "Scale deployment to 5 replicas"
    deployment:
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "1000m"
          memory: "1Gi"
