# Deployment for kubectl-mcp-server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubectl-mcp-server
  namespace: kubectl-mcp
  labels:
    app: kubectl-mcp-server
    app.kubernetes.io/name: kubectl-mcp-server
    app.kubernetes.io/version: "2.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubectl-mcp-server
  template:
    metadata:
      labels:
        app: kubectl-mcp-server
        app.kubernetes.io/name: kubectl-mcp-server
    spec:
      serviceAccountName: kubectl-mcp-server
      containers:
        - name: kubectl-mcp-server
          image: rohitghumare64/kubectl-mcp-server:2.0.0
          imagePullPolicy: IfNotPresent
          args:
            - "--transport"
            - "http"
            - "--port"
            - "8000"
            - "--read-only"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MCP_DEBUG
              value: "0"
            - name: MCP_K8S_PROVIDER
              value: "in-cluster"
            - name: MCP_SERVER_HOST
              value: "0.0.0.0"
            # Unauthenticated: restrict callers with a NetworkPolicy, or replace with
            # MCP_AUTH_ENABLED=true + MCP_AUTH_ISSUER=<your IdP>.
            - name: MCP_ALLOW_UNAUTHENTICATED
              value: "true"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/mcp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
