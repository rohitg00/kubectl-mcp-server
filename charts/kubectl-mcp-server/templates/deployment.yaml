{{- if and (not .Values.auth.enabled) (not .Values.mcp.allowUnauthenticated) }}
{{- fail "kubectl-mcp-server exposes Kubernetes credentials over the network: set auth.enabled=true (with auth.issuer), or mcp.allowUnauthenticated=true if access is restricted by NetworkPolicy/mesh policy" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubectl-mcp-server.fullname" . }}
  labels:
    {{- include "kubectl-mcp-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kubectl-mcp-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kubectl-mcp-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kubectl-mcp-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --transport
            - {{ .Values.mcp.transport | quote }}
            - --port
            - "{{ .Values.mcp.port }}"
            {{- if eq .Values.safety.mode "read-only" }}
            - --read-only
            {{- else if eq .Values.safety.mode "disable-destructive" }}
            - --disable-destructive
            {{- else if eq .Values.safety.mode "confirm" }}
            - --confirm-destructive
            {{- end }}
          env:
            - name: MCP_SERVER_HOST
              value: "0.0.0.0"
            - name: MCP_K8S_PROVIDER
              value: in-cluster
            {{- if .Values.mcp.allowUnauthenticated }}
            - name: MCP_ALLOW_UNAUTHENTICATED
              value: "true"
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: MCP_AUTH_ENABLED
              value: "true"
            - name: MCP_AUTH_ISSUER
              value: {{ required "auth.issuer is required when auth.enabled=true" .Values.auth.issuer | quote }}
            - name: MCP_AUTH_AUDIENCE
              value: {{ .Values.auth.audience | quote }}
            - name: MCP_AUTH_REQUIRED_SCOPES
              value: {{ .Values.auth.requiredScopes | quote }}
            {{- with .Values.auth.jwksUri }}
            - name: MCP_AUTH_JWKS_URI
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.resourceUrl }}
            - name: MCP_AUTH_RESOURCE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.mcp.requestStateKeySecret }}
            - name: MCP_REQUEST_STATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: request-state-key
            {{- end }}
            {{- if .Values.mcp.debug }}
            - name: MCP_DEBUG
              value: "true"
            {{- end }}
            {{- if .Values.mcp.logFile }}
            - name: MCP_LOG_FILE
              value: {{ .Values.mcp.logFile | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.port }}
              protocol: TCP
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/mcp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: home
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
