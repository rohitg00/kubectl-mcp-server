# Default values for kubectl-mcp-server.
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: rohitghumare64/kubectl-mcp-server
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  name: ""

# RBAC configuration
rbac:
  # Create ClusterRole and ClusterRoleBinding
  create: true
  # Grant access to Secrets (read; write/delete outside read-only mode). Off by default:
  # any MCP client can then read every Secret in the cluster.
  secrets: false
  # Note: Currently only cluster-wide RBAC is supported.
  # The MCP server needs read access across all namespaces to function properly.

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001

service:
  type: ClusterIP
  port: 8000
  annotations: {}

# MCP Server configuration
mcp:
  # Transport: "http" (stateless Streamable HTTP, served at /mcp). Any replica can serve any request.
  transport: http
  # Server port
  port: 8000
  # Toolsets to register: "default" (core + helm, 26 tools), "all", or a list such as
  # "default,diagnostics,gitops". Tools outside these toolsets are not registered at all.
  toolsets: default
  # List only the default tools plus search_tools/call_tool; other enabled tools are
  # discovered on demand. Useful with many toolsets and clients without built-in tool search.
  toolSearch: false
  # Serve without OAuth. Only for networks that are otherwise locked down (NetworkPolicy,
  # mesh mTLS + authz). Installation fails unless auth.enabled or this is true.
  allowUnauthenticated: false
  # Secret holding a >=32 byte key (key name "request-state-key") shared by all replicas.
  # Needed for safety.mode=confirm with more than one replica.
  requestStateKeySecret: ""
  # Enable debug logging
  debug: false
  # Log to file (leave empty to disable)
  logFile: ""

# OAuth 2.1 resource-server authentication (JWT validated against the issuer's JWKS)
auth:
  enabled: false
  issuer: ""
  jwksUri: ""
  audience: kubectl-mcp-server
  # Comma-separated. Tokens with mcp:tools or mcp:admin may call every tool; with
  # requiredScopes=mcp:read, read tools need mcp:read and write tools need mcp:write.
  requiredScopes: mcp:tools
  # Public URL of this server, advertised in RFC 9728 protected resource metadata
  resourceUrl: ""

# Safety mode: "read-only" (default), "disable-destructive", "confirm", or "normal".
# Also scopes the ClusterRole: write/delete rules are only granted outside read-only mode.
safety:
  mode: read-only

# Metrics configuration
metrics:
  # Enable Prometheus metrics endpoint
  enabled: false
  # ServiceMonitor for Prometheus Operator
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
    namespace: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: kubectl-mcp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: kubectl-mcp-tls
  #    hosts:
  #      - kubectl-mcp.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

nodeSelector: {}

tolerations: []

affinity: {}

# Extra environment variables
extraEnv: []
  # - name: MY_VAR
  #   value: "my-value"

# Extra volume mounts
extraVolumeMounts: []

# Extra volumes
extraVolumes: []

# Liveness and readiness probes
livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# ConfigMap for additional configuration
config:
  # Enable ConfigMap creation
  enabled: false
  # Custom configuration data
  data: {}
